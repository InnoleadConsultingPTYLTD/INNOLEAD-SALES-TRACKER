# render.yaml
# Place this in the ROOT of your repo.
# Render will auto-detect it and set up both the API service and the database.

services:
  - type: web
    name: innolead-api
    runtime: python
    rootDir: backend          # folder containing main.py
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: innolead-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true   # Render generates a secure random value
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "https://your-frontend.onrender.com"  # ← update this

databases:
  - name: innolead-db
    databaseName: innolead_db
    user: innolead_user
    plan: free
